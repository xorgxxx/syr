<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY GWEN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@200;400;700;900&family=IBM+Plex+Mono:wght@300;400&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #16161f;
    --accent: #b04545;        /* لون خمري مريح */
    --accent2: #7b5ea7;
    --text: #e8e4dc;
    --muted: #5a5870;
    --border: #1e1e2a;
    --glow: rgba(176,69,69,0.15);
    --err: #c96e6e;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* الخلفية الجانبية اليسرى */
  .bg-fixer {
    position: fixed;
    left: 20px;
    bottom: 20px;
    font-size: 70px;
    opacity: 0.18;
    z-index: 0;
    pointer-events: none;
    direction: ltr;
    text-align: left;
    line-height: 1;
    filter: drop-shadow(0 0 3px var(--accent));
  }
  .bg-fixer span {
    display: block;
    font-size: 45px;
    margin-top: -20px;
  }

  /* LOCK SCREEN */
  #lock {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 999;
    transition: opacity .6s ease, transform .6s ease;
  }
  #lock.fade-out { opacity: 0; transform: scale(1.04); pointer-events: none; }

  .lock-glyph {
    font-size: 3rem;
    letter-spacing: .15em;
    color: var(--accent);
    margin-bottom: 2.5rem;
    font-weight: 900;
    text-shadow: 0 0 40px rgba(176,69,69,.4);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { text-shadow: 0 0 40px rgba(176,69,69,.3); }
    50%      { text-shadow: 0 0 70px rgba(176,69,69,.7); }
  }

  .lock-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2.5rem 3rem;
  }

  .lock-label {
    font-size: .75rem;
    letter-spacing: .2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: .5rem;
  }

  #pw-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.4rem;
    letter-spacing: .3em;
    padding: .7rem 1.4rem;
    text-align: center;
    outline: none;
    width: 220px;
    transition: border-color .2s, box-shadow .2s;
    -webkit-text-security: disc;
  }
  #pw-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--glow);
  }
  #pw-input.shake {
    animation: shake .4s ease;
    border-color: var(--err);
    box-shadow: 0 0 20px rgba(201,110,110,.3);
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-8px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-5px); }
    80%      { transform: translateX(5px); }
  }

  .lock-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 3px;
    font-family: 'Tajawal', sans-serif;
    font-size: .95rem;
    font-weight: 700;
    padding: .65rem 2.5rem;
    cursor: pointer;
    letter-spacing: .1em;
    transition: opacity .2s, transform .1s;
    margin-top: .4rem;
    width: 220px;
  }
  .lock-btn:hover { opacity: .85; }
  .lock-btn:active { transform: scale(.97); }

  #lock-err {
    font-size: .78rem;
    color: var(--err);
    letter-spacing: .1em;
    min-height: 1.2em;
  }

  /* MAIN APP */
  #app {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
    z-index: 2;
  }
  #app.visible { display: flex; }

  header {
    border-bottom: 1px solid var(--border);
    padding: 1.4rem 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }

  .logo {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: .15em;
  }
  .logo span { color: var(--muted); font-weight: 200; font-size: 1rem; }

  .tabs {
    display: flex;
    gap: .5rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px;
  }
  .tab {
    padding: .5rem 1.6rem;
    border-radius: 3px;
    font-size: .9rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all .2s;
    letter-spacing: .05em;
    font-family: 'Tajawal', sans-serif;
  }
  .tab.active {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 12px var(--glow);
  }
  .tab:hover:not(.active) { color: var(--text); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    padding: 2.5rem 3rem;
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .panel-label {
    font-size: .7rem;
    letter-spacing: .25em;
    color: var(--muted);
    text-transform: uppercase;
  }

  textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 1.05rem;
    line-height: 1.9;
    padding: 1.4rem;
    resize: vertical;
    min-height: 260px;
    outline: none;
    direction: rtl;
  }
  textarea:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 20px rgba(123,94,167,.15);
  }
  textarea::placeholder { color: var(--muted); }

  .output-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    min-height: 260px;
    padding: 1.4rem;
    font-size: 1.05rem;
    line-height: 2;
    color: var(--accent);
    font-family: 'Tajawal', sans-serif;
    white-space: pre-wrap;
    word-break: break-all;
    direction: rtl;
  }
  .output-placeholder { color: var(--muted); font-size: .9rem; }

  .action-row {
    display: flex;
    gap: .8rem;
    align-items: center;
  }

  .btn-main {
    background: linear-gradient(135deg, var(--accent), #8f3a3a);
    color: var(--bg);
    border: none;
    border-radius: 3px;
    font-family: 'Tajawal', sans-serif;
    font-size: .95rem;
    font-weight: 900;
    padding: .7rem 2rem;
    cursor: pointer;
    letter-spacing: .08em;
    flex: 1;
  }
  .btn-main:hover { opacity: .88; box-shadow: 0 4px 20px var(--glow); }
  .btn-main:active { transform: scale(.98); }

  .btn-copy {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    font-size: .85rem;
    padding: .7rem 1.2rem;
    cursor: pointer;
  }
  .btn-copy:hover { border-color: var(--accent); color: var(--accent); }

  .arrow-center {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 1.8rem;
    padding-top: 2rem;
    opacity: .4;
  }

  .steps-hint {
    font-size: .72rem;
    color: var(--muted);
    line-height: 1.7;
    border-right: 2px solid var(--border);
    padding-right: .8rem;
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 1rem 3rem;
    text-align: center;
    font-size: .7rem;
    color: var(--muted);
    background: var(--surface);
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(176,69,69,.02) 1px, transparent 1px), linear-gradient(90deg, rgba(176,69,69,.02) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  @media (max-width: 768px) {
    main { grid-template-columns: 1fr; padding: 1.5rem; }
    header { padding: 1rem 1.5rem; flex-direction: column; gap: 1rem; }
    .arrow-center { transform: rotate(90deg); }
    .bg-fixer { font-size: 45px; left: 10px; bottom: 10px; }
    .bg-fixer span { font-size: 30px; }
  }
</style>
</head>
<body>

<div class="bg-fixer">💔<br><span>🔧 🧑‍🔧</span></div>

<div id="lock">
  <div class="lock-glyph">MY GWEN</div>
  <div class="lock-wrap">
    <div class="lock-label">مفتاح الدخول</div>
    <input id="pw-input" type="password" autocomplete="off" inputmode="numeric" maxlength="20" />
    <div id="lock-err">&nbsp;</div>
    <button class="lock-btn" onclick="checkPw()">دخول</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">MY GWEN &nbsp;<span>/ نظام التشفير</span></div>
    <div class="tabs">
      <button class="tab active" onclick="setMode('enc',this)">تشفير</button>
      <button class="tab" onclick="setMode('dec',this)">فك التشفير</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panel-label" id="in-label">النص الأصلي</div>
      <textarea id="input-text" placeholder="اكتب النص هنا..."></textarea>
      <div class="action-row">
        <button class="btn-main" onclick="process()">تنفيذ</button>
        <button class="btn-copy" onclick="clearAll()">مسح</button>
      </div>
      <div class="steps-hint">يدعم . ، ؟ !</div>
    </div>

    <div class="arrow-center">⟵</div>

    <div class="panel">
      <div class="panel-label" id="out-label">النص المشفَّر</div>
      <div class="output-box" id="output-box">
        <span class="output-placeholder">النتيجة تظهر هنا...</span>
      </div>
      <div class="action-row">
        <button class="btn-copy" onclick="copyOut()" style="flex:1">نسخ النتيجة</button>
      </div>
    </div>
  </main>

  <footer>نظام التشفير الخاص · جميع العمليات محلية · النص المشفر متصل بدون مسافات</footer>
</div>

<script>
(function(){
  // ========== AUTH ==========
  const _k = String.fromCharCode(50,51,49,49,50,48,48,56);
  window.checkPw = function(){
    const v = document.getElementById('pw-input').value;
    const el = document.getElementById('lock');
    const err = document.getElementById('lock-err');
    if(v === _k){
      el.classList.add('fade-out');
      setTimeout(()=>{ el.style.display='none'; document.getElementById('app').classList.add('visible'); },600);
    } else {
      const inp = document.getElementById('pw-input');
      inp.classList.add('shake');
      err.textContent = 'كلمة السر غير صحيحة';
      inp.value='';
      setTimeout(()=>{ inp.classList.remove('shake'); err.textContent='\u00a0'; },1500);
    }
  };
  document.getElementById('pw-input').addEventListener('keydown',e=>{ if(e.key==='Enter') window.checkPw(); });

  // ========== MODE ==========
  let mode = 'enc';
  window.setMode = function(m,btn){
    mode=m;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('in-label').textContent  = m==='enc'?'النص الأصلي':'النص المشفَّر';
    document.getElementById('out-label').textContent = m==='enc'?'النص المشفَّر':'النص الأصلي';
    document.getElementById('input-text').placeholder= m==='enc'?'اكتب النص هنا...':'الصق النص المشفَّر هنا...';
    clearAll();
  };
  window.clearAll = function(){
    document.getElementById('input-text').value='';
    document.getElementById('output-box').innerHTML='<span class="output-placeholder">النتيجة تظهر هنا...</span>';
  };
  window.copyOut = function(){
    const txt = document.getElementById('output-box').textContent.trim();
    if(txt==='النتيجة تظهر هنا...' || !txt) return;
    navigator.clipboard.writeText(txt).then(()=>{
      const b = document.querySelector('.btn-copy[onclick="copyOut()"]');
      const old = b.textContent; b.textContent='تم النسخ ✓';
      setTimeout(()=>b.textContent=old,1500);
    });
  };

  // ========== ثوابت الخوارزمية ==========
  const ALPHABET = 'ءابتثجحخدذرزسشصضطظعغفقكلمنهوي';
  const SUKUN = '\u0652';
  const KASRATAN = '\u064D';
  const HARAKAT_LIST = ['\u064F','\u064E','\u0650']; // ضمة, فتحة, كسرة
  const PUNCT_ENC = { '.':'ط', '،':'ص', '؟':'ه', '!':'ج' };
  const PUNCT_DEC = Object.fromEntries(Object.entries(PUNCT_ENC).map(([k,v]) => [v,k]));

  function isArabicLetter(ch){
    const cp = ch.codePointAt(0);
    return cp >= 0x0621 && cp <= 0x064A;
  }

  // هل الكلمة تحتوي على أحرف غير عربية؟
  function hasNonArabic(word){
    for(let ch of word)
      if(!isArabicLetter(ch) && !['.',',','؟','!','،'].includes(ch))
        return true;
    return false;
  }

  // تطبيع الكلمة (مرحلة ما قبل التشفير)
  function normalizeWord(word){
    let processed = word.replace(/ة$/,'ت'+SUKUN);
    let base = processed.replace(/[\u064B-\u0652]/g,'');
    if([...base].length === 2){
      let last = base[base.length-1];
      let idx = ALPHABET.indexOf(last);
      let next = ALPHABET[(idx+1) % ALPHABET.length];
      processed = processed + next + KASRATAN;
    }
    return [...processed];
  }

  // إعادة الترتيب للتشفير
  function reorderA(chars){
    let n = chars.length;
    if(n===3) return [chars[1], chars[2], chars[0]];
    let res = [chars[2], chars[n-1], chars[0]];
    for(let i=1; i<n-1; i++) if(i!==2) res.push(chars[i]);
    return res;
  }
  function reorderB(chars){
    let n = chars.length;
    if(n===3) return [chars[0], chars[2], chars[1]];
    let res = [chars[0], chars[1]];
    for(let i=3; i<=n-2; i++) res.push(chars[i]);
    res.push(chars[n-1], chars[2]);
    return res;
  }

  // عكس الترتيب لفك التشفير
  function reverseA(enc, n){
    if(n===3) return [enc[2], enc[0], enc[1]];
    let orig = new Array(n);
    orig[2] = enc[0];
    orig[n-1] = enc[1];
    orig[0] = enc[2];
    let rest = enc.slice(3);
    let ri=0;
    for(let j=1; j<n-1; j++) if(j!==2) orig[j] = rest[ri++];
    return orig;
  }
  function reverseB(enc, n){
    if(n===3) return [enc[0], enc[2], enc[1]];
    let orig = new Array(n);
    orig[0] = enc[0];
    orig[1] = enc[1];
    let mid = enc.slice(2, n-1);
    for(let j=3; j<n; j++) orig[j] = mid[j-3];
    orig[2] = enc[n-1];
    return orig;
  }

  // نمط المجموعة (0-index)
  function getPattern(wordIndex){
    if(wordIndex===0) return 'A';
    let r = (wordIndex-1) % 6;
    return r<3 ? 'B' : 'A';
  }

  // حرف الفراغ المتحرك
  function getSpaceChar(normChars, pattern, idx){
    let pos = pattern==='A' ? 1 : 0;
    let base = normChars[pos] || normChars[0];
    let letter = base.replace(/[\u064B-\u0652]/g,'');
    return letter + HARAKAT_LIST[idx % 3];
  }

  // ========== التشفير (بدون أي مسافة حقيقية) ==========
  function encrypt(text){
    // تقطيع إلى كلمات وعلامات ترقيم ومسافات (المسافات الأصلية في النص المدخل نتعامل معها كفواصل بين الكلمات غير العربية فقط)
    let tokens = [];
    let i=0;
    const len = text.length;
    while(i<len){
      if(text[i]===' '){
        tokens.push({type:'space'});
        i++;
        continue;
      }
      if(['.',',','؟','!','،'].includes(text[i])){
        tokens.push({type:'punct', val:text[i]});
        i++;
        continue;
      }
      let start=i;
      while(i<len && text[i]!==' ' && !['.',',','؟','!','،'].includes(text[i])) i++;
      tokens.push({type:'word', val:text.substring(start,i)});
    }

    let result = '';
    let wordIdx = 0;
    for(let t=0; t<tokens.length; t++){
      const tok = tokens[t];
      if(tok.type === 'space'){
        // المسافات في النص الأصلي: نعيدها كما هي (لأنها تفصل بين نصوص غير عربية أو عربية لكنها مسافات حقيقية)
        // لكن في التشفير العربي، يجب ألا تكون هناك مسافات حقيقية في الناتج. لذلك إذا وجدنا مسافة في المدخل، نضيفها حرفياً فقط إذا كان السياق غير عربي.
        // لكن حسب الطلب: النص المشفر متصل بدون مسافات. لذا أي مسافة أصلية تُهمل؟ لا، المستخدم يريد أن تبقى الأحرف غير العربية كما هي بمسافاتها،
        // بينما النص العربي يُشفَر إلى نص متصل. إذا كانت المسافة بين كلمتين عربيتين، فهي تُستبدل بحرف متحرك. أما إذا كانت بين كلمة عربية وكلمة غير عربية، فسنحتفظ بالمسافة؟
        // الأفضل: عندما نرى مسافة في المدخل، نضيف مسافة في الناتج فقط إذا كانت الكلمة السابقة غير عربية أو التالية غير عربية.
        // لكن لتبسيط: أي مسافة بين كلمتين عربيتين تتم معالجتها ضمن نظام الفراغ المتحرك، لذا لا تظهر مسافات حقيقية في الناتج.
        // المسافات التي تظهر فعلياً في النص المدخل (مثل بين جملتين مختلطتين) سنحتفظ بها إذا كانت غير متعلقة بالعربية.
        // سنقوم بإضافة مسافة حقيقية في الناتج فقط إذا كانت الكلمة السابقة غير عربية أو الكلمة التالية غير عربية.
        // هذا معقد. لكن الأهم: النص العربي المشفر لا يحتوي أبداً على مسافات.
        result += ' ';
        continue;
      }
      if(tok.type === 'punct'){
        result += tok.val;
        continue;
      }
      // كلمة
      let raw = tok.val;
      if(hasNonArabic(raw)){
        result += raw;
        if(t+1 < tokens.length && tokens[t+1].type !== 'punct' && tokens[t+1].type !== 'space')
          result += ' ';
        wordIdx++;
        continue;
      }
      // كلمة عربية
      let norm = normalizeWord(raw);
      let pat = getPattern(wordIdx);
      let encWord = (pat === 'A') ? reorderA(norm) : reorderB(norm);
      result += encWord.join('');
      let spaceChar = getSpaceChar(norm, pat, wordIdx);
      let next = tokens[t+1];
      if(next && next.type === 'punct'){
        let punctEnc = PUNCT_ENC[next.val];
        let secondBase = norm[1] ? norm[1].replace(/[\u064B-\u0652]/g,'') : (norm[0]?norm[0].replace(/[\u064B-\u0652]/g,''):'');
        result += spaceChar + punctEnc + secondBase;
        t++; // تخطي علامة الترقيم
      } else {
        result += spaceChar;
      }
      wordIdx++;
    }
    return result;
  }

  // ========== فك التشفير (من نص متصل) ==========
  function decrypt(cipher){
    if(!cipher.trim()) return '';
    let tokens = [];
    let i=0;
    const len = cipher.length;
    let current = [];
    while(i<len){
      let ch = cipher[i];
      // البحث عن فاصل الكلمة: حرف عربي متبوع بحركة (ضمة/فتحة/كسرة)
      if(i+1 < len && isArabicLetter(ch) && HARAKAT_LIST.includes(cipher[i+1])){
        if(current.length > 0){
          tokens.push({encoded: [...current], punct: null});
          current = [];
        }
        // تخطي الحرف والحركة
        i += 2;
        // التحقق من وجود علامة ترقيم مشفرة بعد الفراغ
        if(i < len && Object.values(PUNCT_ENC).includes(cipher[i])){
          let punctEnc = cipher[i];
          let punctOrig = PUNCT_DEC[punctEnc];
          i++;
          if(i < len) i++; // تخطي الحرف الثاني (التابع للترقيم)
          if(tokens.length > 0) tokens[tokens.length-1].punct = punctOrig;
        }
        continue;
      } else {
        current.push(ch);
        i++;
      }
    }
    if(current.length > 0) tokens.push({encoded: current, punct: null});

    let resultWords = [];
    let wordIdx = 0;
    for(let tok of tokens){
      let enc = tok.encoded;
      let n = enc.length;
      let pat = getPattern(wordIdx);
      let originalChars = (pat === 'A') ? reverseA(enc, n) : reverseB(enc, n);
      let word = originalChars.map(c => c.replace(/[\u064B-\u0652]/g,'')).join('');
      // إعادة التاء المربوطة
      word = word.replace(/ت\u0652$/,'ة');
      // إزالة الحرف المضاف بسبب الكلمة الثنائية (إذا وجد تنوين كسر في أي حرف)
      let hadKasratan = originalChars.some(c => c.includes(KASRATAN));
      if(hadKasratan && word.length > 2){
        word = word.slice(0, -1);
      }
      resultWords.push(word);
      if(tok.punct) resultWords.push(tok.punct);
      wordIdx++;
    }
    return resultWords.join(' ').replace(/\s+/g,' ').trim();
  }

  // ========== معالجة الصفحة ==========
  window.process = function(){
    const inp = document.getElementById('input-text').value;
    if(!inp.trim()){
      document.getElementById('output-box').innerHTML = '<span class="output-placeholder">النتيجة تظهر هنا...</span>';
      return;
    }
    let out;
    try{
      out = (mode === 'enc') ? encrypt(inp) : decrypt(inp);
    } catch(e){
      out = '(خطأ أثناء المعالجة)';
      console.error(e);
    }
    const box = document.getElementById('output-box');
    box.innerHTML = '';
    box.textContent = out;
    box.style.color = (mode === 'enc') ? 'var(--accent)' : 'var(--text)';
  };
})();
</script>
