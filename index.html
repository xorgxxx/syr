<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>نظام تحويل النصوص</title>
    <style>
        * { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { background: linear-gradient(135deg, #0a2f2f, #043535); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; margin: 0; }
        .container { background: rgba(255,255,255,0.95); border-radius: 40px; padding: 30px; max-width: 900px; width: 100%; box-shadow: 0 25px 45px rgba(0,0,0,0.3); }
        h1 { text-align: center; color: #0a4e4e; }
        .pass-box { background: #eef4f4; padding: 15px; border-radius: 30px; margin-bottom: 25px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
        #pwd { padding: 10px 20px; border-radius: 50px; border: 1px solid #2c7878; font-size: 18px; width: 160px; text-align: center; }
        .mode-btns { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; }
        .mode { background: #cfe9e9; border: none; padding: 12px 28px; border-radius: 60px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .mode.active { background: #0a6b6b; color: white; }
        textarea { width: 100%; padding: 18px; font-size: 18px; border-radius: 28px; border: 1.5px solid #bdd4d4; box-sizing: border-box; }
        .run { background: #0f5c5c; color: white; font-size: 20px; padding: 12px; width: 100%; border: none; border-radius: 60px; margin: 15px 0; cursor: pointer; }
        .res { background: #e9f3f3; border-radius: 30px; padding: 15px; margin-top: 20px; border-right: 8px solid #0a6b6b; }
        footer { font-size: 12px; text-align: center; margin-top: 20px; color: #608b8b; }
    </style>
</head>
<body>
<div class="container">
    <h1>نظام تحويل النصوص</h1>
    <div class="pass-box">
        <label>مفتاح:</label>
        <input type="password" id="pwd" placeholder="••••">
        <span id="pst">⚪</span>
    </div>
    <div class="mode-btns">
        <button id="b1" class="mode active">تحويل →</button>
        <button id="b2" class="mode">← تحويل عكسي</button>
    </div>
    <textarea id="inp" rows="4" placeholder="أدخل النص..."></textarea>
    <button id="go" class="run">تنفيذ</button>
    <div class="res">
        <div>النتيجة:</div>
        <div id="out" style="font-family: monospace; font-size: 18px;">—</div>
    </div>
    <footer>نظام مغلق</footer>
</div>

<script>
(function(){
    let s1 = "ODAwMjExMzI=";
    let s2 = atob(s1);
    let s3 = s2.split('').reverse().join('');
    let KEY = s3;

    let ab = "ابتثجحخدذرزسشصضطظعغفقكلمنهوي";

    function fa(x){
        let i = ab.indexOf(x);
        if(i>=0 && i+1<ab.length) return ab[i+1];
        return "ا";
    }

    function za(w){
        let r = w;
        if(r.endsWith("ة")) r = r.slice(0,-1)+"تْ";
        let h = [];
        for(let i=0;i<r.length;i++) if(r[i]!='ْ') h.push(r[i]);
        if(h.length===2){
            let n = fa(h[1]);
            h.push(n,"ٍ");
        }
        return h;
    }

    function raA(a){
        let n=a.length;
        if(n===3) return [a[1],a[2],a[0]];
        let r=[a[2],a[n-1],a[0]];
        for(let i=3;i<=n-2;i++) r.push(a[i]);
        return r;
    }
    function raB(a){
        let n=a.length;
        if(n===3) return [a[0],a[2],a[1]];
        let r=[a[0],a[1]];
        for(let i=3;i<=n-2;i++) r.push(a[i]);
        r.push(a[n-1],a[2]);
        return r;
    }

    function sp(l,p){
        let i = p==='A'?1:0;
        return l[i]+"ُ";
    }

    function pt(g){
        let o=['A'];
        let l='A';
        while(o.length<g){
            if(l==='A'){o.push('B','B','B'); l='B';}
            else {o.push('A','A','A'); l='A';}
        }
        return o.slice(0,g);
    }

    function enc(t){
        let w = t.trim().split(/\s+/);
        if(!w.length) return "";
        let nw = w.map(z=>za(z));
        let gr=[];
        for(let i=0;i<nw.length;i+=3) gr.push(nw.slice(i,i+3));
        let ps = pt(gr.length);
        let out=[];
        for(let i=0;i<gr.length;i++){
            let pa = ps[i];
            for(let tk of gr[i]){
                let rr = pa==='A'?raA(tk):raB(tk);
                let spc = sp(tk,pa);
                out.push(rr.join('')+spc);
            }
        }
        let r = out.join('');
        r = r.replace(/؟/g,'هـ').replace(/!/g,'ج').replace(/\./g,'ط').replace(/،/g,'ص');
        return r;
    }

    function dec(c){
        let dk = ['ُ','َ','ِ'];
        let toks = [];
        let cur = "";
        for(let ch of c){
            if(dk.includes(ch)){
                if(cur.length){ toks.push({e:cur,sc:ch}); cur=""; }
            } else cur+=ch;
        }
        if(cur.length) toks.push({e:cur,sc:null});
        let wc = toks.length;
        let gc = Math.ceil(wc/3);
        let ps = pt(gc);
        let wp = [];
        for(let i=0;i<gc;i++){
            let p = ps[i];
            for(let j=0;j<3 && (i*3+j)<wc;j++) wp.push(p);
        }
        let orig=[];
        for(let i=0;i<toks.length;i++){
            let eL = [...toks[i].e];
            let p = wp[i];
            let n = eL.length;
            let oL = new Array(n);
            if(p==='A'){
                if(n===3){
                    oL = [eL[2],eL[0],eL[1]];
                } else {
                    oL[0]=eL[2];
                    oL[n-1]=eL[1];
                    let idx=3;
                    for(let j=0;j<n;j++){
                        if(j===0 || j===n-1 || j===2) continue;
                        oL[j]=eL[idx++];
                    }
                    oL[2]=eL[eL.length-1];
                }
            } else {
                if(n===3){
                    oL = [eL[0],eL[2],eL[1]];
                } else {
                    oL[0]=eL[0];
                    oL[1]=eL[1];
                    oL[n-1]=eL[eL.length-2];
                    oL[2]=eL[eL.length-1];
                    let f=3;
                    for(let j=3;j<=n-2;j++) oL[j]=eL[f++];
                }
            }
            let clean = [];
            for(let ch of oL) if(ch!='ٍ') clean.push(ch);
            let wrd = clean.join('');
            if(wrd.endsWith("تْ")) wrd = wrd.slice(0,-2)+"ة";
            orig.push(wrd);
        }
        return orig.join(' ');
    }

    let pin = document.getElementById('pwd');
    let st = document.getElementById('pst');
    let btnE = document.getElementById('b1');
    let btnD = document.getElementById('b2');
    let ta = document.getElementById('inp');
    let go = document.getElementById('go');
    let outDiv = document.getElementById('out');
    let mode = "e";

    function chk(){
        if(pin.value === KEY){
            st.innerText = "✓";
            st.style.background = "#b9f6ca";
            return true;
        }
        st.innerText = "✗";
        st.style.background = "#ffcdd2";
        return false;
    }

    pin.addEventListener('input', chk);
    btnE.addEventListener('click',()=>{ mode="e"; btnE.classList.add('active'); btnD.classList.remove('active'); });
    btnD.addEventListener('click',()=>{ mode="d"; btnD.classList.add('active'); btnE.classList.remove('active'); });
    go.addEventListener('click',()=>{
        if(!chk()){ outDiv.innerText = "مفتاح غير صحيح"; return; }
        let txt = ta.value.trim();
        if(!txt){ outDiv.innerText = "فارغ"; return; }
        try{
            let res = mode==="e"? enc(txt) : dec(txt);
            outDiv.innerText = res || "[فارغ]";
        } catch(e){ outDiv.innerText = "خطأ"; }
    });
    chk();
})();
</script>
</body>
</html>
