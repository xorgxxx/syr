<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY GWEN  </title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@200;400;700;900&family=IBM+Plex+Mono:wght@300;400&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #16161f;
    --accent: #c8a96e;
    --accent2: #7b5ea7;
    --text: #e8e4dc;
    --muted: #5a5870;
    --border: #1e1e2a;
    --glow: rgba(200,169,110,0.15);
    --err: #c96e6e;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ───── LOCK SCREEN ───── */
  #lock {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 999;
    transition: opacity .6s ease, transform .6s ease;
  }
  #lock.fade-out { opacity: 0; transform: scale(1.04); pointer-events: none; }

  .lock-glyph {
    font-size: 3.5rem;
    letter-spacing: .3em;
    color: var(--accent);
    margin-bottom: 2.5rem;
    font-weight: 900;
    text-shadow: 0 0 40px rgba(200,169,110,.4);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { text-shadow: 0 0 40px rgba(200,169,110,.3); }
    50%      { text-shadow: 0 0 70px rgba(200,169,110,.7); }
  }

  .lock-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2.5rem 3rem;
  }

  .lock-label {
    font-size: .75rem;
    letter-spacing: .2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: .5rem;
  }

  #pw-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.4rem;
    letter-spacing: .3em;
    padding: .7rem 1.4rem;
    text-align: center;
    outline: none;
    width: 220px;
    transition: border-color .2s, box-shadow .2s;
    -webkit-text-security: disc;
  }
  #pw-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--glow);
  }
  #pw-input.shake {
    animation: shake .4s ease;
    border-color: var(--err);
    box-shadow: 0 0 20px rgba(201,110,110,.3);
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-8px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-5px); }
    80%      { transform: translateX(5px); }
  }

  .lock-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 3px;
    font-family: 'Tajawal', sans-serif;
    font-size: .95rem;
    font-weight: 700;
    padding: .65rem 2.5rem;
    cursor: pointer;
    letter-spacing: .1em;
    transition: opacity .2s, transform .1s;
    margin-top: .4rem;
    width: 220px;
  }
  .lock-btn:hover { opacity: .85; }
  .lock-btn:active { transform: scale(.97); }

  #lock-err {
    font-size: .78rem;
    color: var(--err);
    letter-spacing: .1em;
    min-height: 1.2em;
    transition: opacity .3s;
  }

  /* ───── MAIN APP ───── */
  #app {
    display: none;
    flex-direction: column;
    min-height: 100vh;
  }
  #app.visible { display: flex; }

  header {
    border-bottom: 1px solid var(--border);
    padding: 1.4rem 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }

  .logo {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: .15em;
  }
  .logo span { color: var(--muted); font-weight: 200; font-size: 1rem; }

  .tabs {
    display: flex;
    gap: .5rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px;
  }
  .tab {
    padding: .5rem 1.6rem;
    border-radius: 3px;
    font-size: .9rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all .2s;
    letter-spacing: .05em;
    font-family: 'Tajawal', sans-serif;
  }
  .tab.active {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 12px var(--glow);
  }
  .tab:hover:not(.active) { color: var(--text); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    padding: 2.5rem 3rem;
    gap: 2rem;
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .panel-label {
    font-size: .7rem;
    letter-spacing: .25em;
    color: var(--muted);
    text-transform: uppercase;
  }

  textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 1.05rem;
    line-height: 1.9;
    padding: 1.4rem;
    resize: vertical;
    min-height: 260px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    direction: rtl;
  }
  textarea:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 20px rgba(123,94,167,.15);
  }
  textarea::placeholder { color: var(--muted); }

  .output-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    min-height: 260px;
    padding: 1.4rem;
    font-size: 1.05rem;
    line-height: 2;
    color: var(--accent);
    font-family: 'Tajawal', sans-serif;
    white-space: pre-wrap;
    word-break: break-all;
    direction: rtl;
    position: relative;
  }
  .output-placeholder { color: var(--muted); font-size: .9rem; }

  .action-row {
    display: flex;
    gap: .8rem;
    align-items: center;
  }

  .btn-main {
    background: linear-gradient(135deg, var(--accent), #a8894e);
    color: var(--bg);
    border: none;
    border-radius: 3px;
    font-family: 'Tajawal', sans-serif;
    font-size: .95rem;
    font-weight: 900;
    padding: .7rem 2rem;
    cursor: pointer;
    letter-spacing: .08em;
    transition: opacity .2s, transform .1s, box-shadow .2s;
    flex: 1;
  }
  .btn-main:hover { opacity: .88; box-shadow: 0 4px 20px var(--glow); }
  .btn-main:active { transform: scale(.98); }

  .btn-copy {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    font-family: 'Tajawal', sans-serif;
    font-size: .85rem;
    padding: .7rem 1.2rem;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-copy:hover { border-color: var(--accent); color: var(--accent); }

  .arrow-center {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 1.8rem;
    padding-top: 2rem;
    opacity: .4;
  }

  .steps-hint {
    font-size: .72rem;
    color: var(--muted);
    line-height: 1.7;
    letter-spacing: .03em;
    border-right: 2px solid var(--border);
    padding-right: .8rem;
    margin-top: .3rem;
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 1rem 3rem;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: .7rem;
    color: var(--muted);
    letter-spacing: .15em;
    background: var(--surface);
  }

  /* grid lines bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,169,110,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,169,110,.02) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }
  #lock, #app { position: relative; z-index: 1; }

  @media (max-width: 768px) {
    main { grid-template-columns: 1fr; padding: 1.5rem; }
    header { padding: 1rem 1.5rem; flex-direction: column; gap: 1rem; }
    .arrow-center { transform: rotate(90deg); }
  }
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock">
  <div class="lock-glyph">ص&nbsp;ف&nbsp;ر</div>
  <div class="lock-wrap">
    <div class="lock-label">مفتاح الدخول</div>
    <input id="pw-input" type="password" autocomplete="off" inputmode="numeric" maxlength="20" />
    <div id="lock-err">&nbsp;</div>
    <button class="lock-btn" onclick="checkPw()">دخول</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="logo">MY GWEN   &nbsp;<span>/ نظام التشفير</span></div>
    <div class="tabs">
      <button class="tab active" onclick="setMode('enc',this)">تشفير</button>
      <button class="tab" onclick="setMode('dec',this)">فك التشفير</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panel-label" id="in-label">النص الأصلي</div>
      <textarea id="input-text" placeholder="اكتب النص هنا..."></textarea>
      <div class="action-row">
        <button class="btn-main" onclick="process()">تنفيذ</button>
        <button class="btn-copy" onclick="clearAll()">مسح</button>
      </div>
      <div class="steps-hint" id="mode-hint">
        يدعم النقطة · الفاصلة · الاستفهام · التعجب
      </div>
    </div>

    <div class="arrow-center">⟵</div>

    <div class="panel">
      <div class="panel-label" id="out-label">النص المشفَّر</div>
      <div class="output-box" id="output-box">
        <span class="output-placeholder">النتيجة تظهر هنا...</span>
      </div>
      <div class="action-row">
        <button class="btn-copy" onclick="copyOut()" style="flex:1">نسخ النتيجة</button>
      </div>
    </div>
  </main>

  <footer>نظام التشفير الخاص &nbsp;·&nbsp; جميع العمليات محلية</footer>
</div>

<script>
(function(){

// ── auth ──────────────────────────────────────────────────
const _k = (function(){
  const p=[50,51,49,49,50,48,48,56];
  return String.fromCharCode(...p);
})();

window.checkPw = function(){
  const v = document.getElementById('pw-input').value;
  const el = document.getElementById('lock');
  const err = document.getElementById('lock-err');
  if(v === _k){
    el.classList.add('fade-out');
    setTimeout(()=>{ el.style.display='none'; document.getElementById('app').classList.add('visible'); },600);
  } else {
    const inp = document.getElementById('pw-input');
    inp.classList.remove('shake');
    void inp.offsetWidth;
    inp.classList.add('shake');
    err.textContent = 'كلمة السر غير صحيحة';
    inp.value='';
    setTimeout(()=>{ inp.classList.remove('shake'); err.textContent='\u00a0'; },1500);
  }
};

document.getElementById('pw-input').addEventListener('keydown',e=>{ if(e.key==='Enter') window.checkPw(); });

// ── mode ──────────────────────────────────────────────────
let mode = 'enc';
window.setMode = function(m,btn){
  mode=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('in-label').textContent  = m==='enc'?'النص الأصلي':'النص المشفَّر';
  document.getElementById('out-label').textContent = m==='enc'?'النص المشفَّر':'النص الأصلي';
  document.getElementById('input-text').placeholder= m==='enc'?'اكتب النص هنا...':'الصق النص المشفَّر هنا...';
  clearAll();
};

window.clearAll=function(){
  document.getElementById('input-text').value='';
  document.getElementById('output-box').innerHTML='<span class="output-placeholder">النتيجة تظهر هنا...</span>';
};

window.copyOut=function(){
  const txt=document.getElementById('output-box').textContent.trim();
  if(txt==='النتيجة تظهر هنا...'||!txt) return;
  navigator.clipboard.writeText(txt).then(()=>{
    const b=document.querySelector('.btn-copy[onclick="copyOut()"]');
    const old=b.textContent; b.textContent='تم النسخ ✓';
    setTimeout(()=>b.textContent=old,1500);
  });
};

// ── Arabic alphabet ───────────────────────────────────────
const ALPHA = 'ءابتثجحخدذرزسشصضطظعغفقكلمنهوي';
// index → next letter
function nextLetter(ch){
  const i = ALPHA.indexOf(ch);
  if(i===-1) return ch;
  return ALPHA[(i+1)%ALPHA.length];
}

// ── normalise ─────────────────────────────────────────────
// Returns array of char objects: {ch, addedBinary}
// Ta marbuta → تْ (two chars: ت with sukun marker)
// Binary word → add next-letter with kasratan diacritic
const KASRATAN = '\u064D'; // ٍ
const SUKUN    = '\u0652'; // ْ

function normaliseWord(word){
  // strip any existing harakat for length counting (keep them for display?)
  // We work on the base letters (no harakat) for structure
  const base = word.replace(/[\u064B-\u0652]/g,''); // strip diacritics
  let chars;

  // replace ta marbuta
  let processed = base.replace(/ة$/,'ت');

  chars = [...processed]; // array of base chars

  // binary → make trinary
  if(chars.length===2){
    const last = chars[chars.length-1];
    const extra = nextLetter(last);
    chars.push(extra+KASRATAN); // mark with kasratan to identify later
  }
  return chars; // array of strings (single chars or char+kasratan)
}

function baseChar(c){ return c.replace(/[\u064B-\u0652]/g,''); }
function hasKasratan(c){ return c.includes(KASRATAN); }

// ── pattern assignment ────────────────────────────────────
// Group index (0-based), size 3 each
// sequence: 1A, 3B, 3A, 3B, 3A...
// group 0 → A
// groups 1,2,3 → B
// groups 4,5,6 → A
// groups 7,8,9 → B
// ...
function groupPattern(gIdx){
  if(gIdx===0) return 'A';
  // after group 0: repeat (3B,3A)
  const r = (gIdx-1)%6;
  return r<3 ? 'B' : 'A';
}

// ── reorder chars ─────────────────────────────────────────
function reorderA(chars){
  const n=chars.length;
  if(n===3) return [chars[1],chars[2],chars[0]];
  // 4+: (3, last, 1, rest in order)
  // positions: 0-indexed → (2, n-1, 0, 1..n-2 except 2 and n-1)
  let result=[];
  result.push(chars[2]);
  result.push(chars[n-1]);
  result.push(chars[0]);
  for(let i=1;i<n-1;i++){ if(i!==2) result.push(chars[i]); }
  return result;
}

function reorderB(chars){
  const n=chars.length;
  if(n===3) return [chars[0],chars[2],chars[1]];
  // 4+: (1,2, chars[3..n-2], last, 3)
  // 0-indexed: (0,1, 3..n-2, n-1, 2)
  let result=[];
  result.push(chars[0]);
  result.push(chars[1]);
  for(let i=3;i<=n-2;i++) result.push(chars[i]);
  result.push(chars[n-1]);
  result.push(chars[2]);
  return result;
}

// ── punctuation map ───────────────────────────────────────
const PUNCT_ENC = { '.':'ط', '،':'ص', '؟':'ه', '!':'ج' };
const PUNCT_DEC = {};
Object.keys(PUNCT_ENC).forEach(k=>PUNCT_DEC[PUNCT_ENC[k]]=k);

// ── harakat for space ─────────────────────────────────────
// We'll always use damma (ُ) for simplicity since the rule says "one of three"
// but no rule specifies which; using damma consistently
const DAMMA  = '\u064F';
const FATHA  = '\u064E';
const KASRA  = '\u0650';
const HARAKATS=[DAMMA,FATHA,KASRA];

function spaceHaraka(wordChars, pattern, wordIdx){
  // pattern A → 2nd char of normalised word (index 1)
  // pattern B → 1st char (index 0)
  const idx = pattern==='A'?1:0;
  const c = baseChar(wordChars[idx]||wordChars[0]);
  // cycle harakat based on word index to add variation
  const h = HARAKATS[wordIdx%3];
  return c+h;
}

// ── ENCRYPT ──────────────────────────────────────────────
function encrypt(text){
  // split into tokens: words + punctuation
  // tokenise preserving punctuation positions
  const tokens = tokenise(text);

  // filter words only for indexing
  const words=[];
  tokens.forEach(t=>{ if(t.type==='word') words.push(t); });

  // assign group/pattern
  words.forEach((w,i)=>{
    w.wIdx=i;
    w.gIdx=Math.floor(i/3);
    w.pattern=groupPattern(w.gIdx);
    w.normChars=normaliseWord(w.value);
  });

  let out='';
  let wi=0;
  for(let ti=0;ti<tokens.length;ti++){
    const tok=tokens[ti];
    if(tok.type==='word'){
      const w=words[wi++];
      const norm=w.normChars;
      const reordered=(w.pattern==='A')?reorderA(norm):reorderB(norm);
      out+=reordered.join('');

      // space char
      const sp=spaceHaraka(norm,w.pattern,w.wIdx);

      // check if next token is punct
      const nextTok=tokens[ti+1];
      if(nextTok&&nextTok.type==='punct'){
        const pChar=PUNCT_ENC[nextTok.value]||nextTok.value;
        // space + punct-char + 2nd-base-char (no haraka)
        const secondBase=baseChar(norm[1]||norm[0]);
        out+=sp+pChar+secondBase;
        ti++; // skip punct token
      } else {
        out+=sp;
      }
    }
  }
  return out.trim();
}

// ── DECRYPT ──────────────────────────────────────────────
// Decryption is complex since we must reverse the process
// Strategy: parse the ciphertext by identifying space-harakat boundaries
function decrypt(cipher){
  // Step 1: split into encrypted word tokens by detecting harakated chars
  // A "space char" is a single arabic letter followed by a harakat (damma/fatha/kasra)
  // optionally followed by punct-cipher + second-base-char
  
  const encTokens = parseEncrypted(cipher);
  if(!encTokens||encTokens.length===0) return '(تعذّر فك التشفير)';

  let result=[];
  encTokens.forEach((tok,i)=>{
    const gIdx=Math.floor(i/3);
    const pattern=groupPattern(gIdx);
    const decoded=decodeWord(tok.chars,pattern);
    result.push(decoded);
    if(tok.punct) result.push(tok.punct);
  });
  return result.join(' ').trim();
}

function parseEncrypted(s){
  // Walk character by character
  // Collect chars until we hit a letter+harakat sequence (space marker)
  const HARAKAT_SET=new Set([DAMMA,FATHA,KASRA]);
  const PUNCT_CIPHERS=new Set(Object.values(PUNCT_ENC));
  
  let tokens=[];
  let cur=[];
  let i=0;
  while(i<s.length){
    const ch=s[i];
    // detect harakat (space signal)
    if(i>0 && HARAKAT_SET.has(ch) && isArabicLetter(s[i-1])){
      // The previous char was the space-letter, remove it from cur
      cur.pop();
      // save word token
      if(cur.length>0){
        let punct=null;
        // check if next chars are punct-cipher + base-letter (no harakat)
        if(i+1<s.length && PUNCT_CIPHERS.has(s[i+1])){
          const pKey=Object.keys(PUNCT_ENC).find(k=>PUNCT_ENC[k]===s[i+1]);
          punct=pKey||null;
          i+=2; // skip punct char + following base-char
        }
        tokens.push({chars:[...cur],punct});
        cur=[];
      }
      i++;
      continue;
    }
    cur.push(ch);
    i++;
  }
  if(cur.length>0) tokens.push({chars:[...cur],punct:null});
  return tokens;
}

function decodeWord(chars,pattern){
  const n=chars.length;
  let original;
  if(pattern==='A'){
    if(n===3){
      // encoded: [1,2,0] → original: [2,0,1]
      original=[chars[2],chars[0],chars[1]];
    } else {
      // encoded: (2,n-1,0,1..n-2 skip 2)
      // reverse: encoded[0]=orig[2], encoded[1]=orig[n-1], encoded[2]=orig[0], rest=orig[1..n-2 skip 2]
      original=new Array(n);
      original[2]=chars[0];
      original[n-1]=chars[1];
      original[0]=chars[2];
      const rest=chars.slice(3);
      let ri=0;
      for(let j=1;j<n-1;j++){ if(j!==2){ original[j]=rest[ri++]; } }
    }
  } else {
    if(n===3){
      // encoded: [0,2,1] → original: [0,2,1] reverse → [0,2,1]
      original=[chars[0],chars[2],chars[1]];
    } else {
      // encoded: (0,1, 3..n-2, n-1, 2)
      original=new Array(n);
      original[0]=chars[0];
      original[1]=chars[1];
      original[2]=chars[n-1];
      const mid=chars.slice(2,n-1);
      let mi=0;
      for(let j=3;j<n;j++) original[j]=mid[mi++];
    }
  }

  // post-process: remove kasratan-marked chars (were added for binary)
  let filtered=original.filter(c=>!hasKasratan(c));
  // convert تْ back to ة if at end
  let word=filtered.map(baseChar).join('');
  // تْ at end → ة (but sukun was stripped; we look for ت at end after we know it came from ة)
  // Since we can't know for sure, we leave as is (or optionally restore)
  word=word.replace(/ت$/,'ة');
  return word;
}

function isArabicLetter(ch){
  if(!ch) return false;
  const cp=ch.codePointAt(0);
  return (cp>=0x0621&&cp<=0x064A);
}

// ── tokeniser ─────────────────────────────────────────────
function tokenise(text){
  const PUNCTS=new Set(['.','،','؟','!']);
  const tokens=[];
  const parts=text.trim().split(/\s+/);
  parts.forEach(p=>{
    if(!p) return;
    // check trailing punct
    const last=p[p.length-1];
    if(PUNCTS.has(last)){
      const word=p.slice(0,-1);
      if(word) tokens.push({type:'word',value:word});
      tokens.push({type:'punct',value:last});
    } else {
      tokens.push({type:'word',value:p});
    }
  });
  return tokens;
}

// ── process ───────────────────────────────────────────────
window.process=function(){
  const inp=document.getElementById('input-text').value.trim();
  if(!inp){ return; }
  let out;
  try{
    out = mode==='enc' ? encrypt(inp) : decrypt(inp);
  } catch(e){
    out='(حدث خطأ في المعالجة)';
  }
  const box=document.getElementById('output-box');
  box.textContent=out;
  box.style.color=mode==='enc'?'var(--accent)':'var(--text)';
};

})();
</script>
